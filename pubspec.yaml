name: learn_acer
description: A new Dartvel project
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
platforms:
  web:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.13.30
  dartvel_shelf: ^0.13.30
  dartvel_flutter: ^0.13.30
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli: ^0.13.30


flutter:
  uses-material-design: true
  assets:
    - assets/

dartvel:
  org: com.danieleffiong
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.learn-acer.com
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  ota: false
  platforms:
    - web
    - android
    - ios
    - linux
    - macos
    - windows

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    siteName: learn acer
    defaultTitle: Welcome
    defaultDescription: A Dartvel application
