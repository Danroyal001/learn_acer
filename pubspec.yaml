name: learn_acer
description: A new Dartvel project
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
platforms:
  web:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.13.30
  dartvel_shelf: ^0.13.30
  dartvel_flutter: ^0.13.30
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli: ^0.13.30


flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Italic.ttf
          style: italic
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/WorkSans-BoldItalic.ttf
          weight: 700
          style: italic

dartvel:
  org: com.danieleffiong
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://learnacer.sigmadev.digital
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  ota: false
  auth:
    tagline: "Your class, your notes and your exam practice."
    brandPanelColor: "#1D4ED8"
    pages:
      signIn: /login
      signUp: /sign-up
  server:
    trustedProxies:
      - 127.0.0.1
  platforms:
    - web
    - android

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    siteName: Learn Acer
    defaultTitle: Learn Acer
    defaultDescription: Learn with ease at home or at school. Classes with join codes, notes, quizzes and exam practice, a periodic table and a scientific calculator.
  pwa:
    icon: assets/icon.png
    name: Learn Acer
    shortName: Learn Acer
    description: Classes, notes, quizzes and exam practice for students, teachers and parents.
    themeColor: '#1D4ED8'
    backgroundColor: '#FBFAF5'
